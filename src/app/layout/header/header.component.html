<section>
  <div class="container">
    @if (showHamburger()) {
      <div
        class="nav-options"
        [class.closing]="!showHamburger()"
        [class.opening]="showHamburger()"
      >
        <button class="hamburger-close" (click)="closeNavigation()">
          <svg
            xmlns="http://w3.org"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <ul>
          <li>About us</li>
          <li>Services</li>
          <li>Use Cases</li>
          <li>Pricing</li>
          <li>Blog</li>
          <li><app-button content="Request a quote" mode="light" /></li>
        </ul>
      </div>
    }
    <app-navbar [mainNav]="true" (toggleHamburger)="toogleHamburger($event)" />
  </div>
</section>
